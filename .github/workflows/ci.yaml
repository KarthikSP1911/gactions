name: ci

on: [push, pull_request]

jobs:
  ci:
    name: Build, lint and test
    runs-on: ubuntu-latest

    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install dependencies
        run: npm ci
      
      - name: run linter
        run: npm run lint